# Include this file inside nginx's http {} block.
# Reuses the certificate and key from the existing soccera.uk nginx sites.
server {
    listen 80;
    listen [::]:80;
    server_name blog.soccera.uk;

    return 301 https://blog.soccera.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.soccera.uk;

    ssl_certificate /var/www/xeetapus/soccera.uk.pem;
    ssl_certificate_key /var/www/xeetapus/soccera.uk.rsa.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
